<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcas | Estacionamentos</title>
    <script type="module" src="../js/pages/marcas.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50">
    <div id="app-shell">
      <main class="p-6 lg:ml-64">
        <div id="page-header"></div>
        <section class="grid gap-6 lg:grid-cols-[minmax(280px,360px)_1fr]">
          <form id="form-marca" class="card space-y-4">
            <input id="marca-id" type="hidden" />
            <div class="flex items-center gap-2">
              <span data-heroicon="tag" class="text-purple-600"></span>
              <h2 class="text-lg font-bold">Cadastro de marca</h2>
            </div>
            <div>
              <label for="marca-nome" class="label">Nome</label>
              <input id="marca-nome" class="input mt-1" required />
            </div>
            <div class="flex gap-2">
              <button class="btn-primary" type="submit"><span data-heroicon="plus"></span>Salvar</button>
              <button id="limpar-marca" class="btn-secondary" type="button">Limpar</button>
            </div>
          </form>
          <div class="card">
            <div class="table-wrapper">
              <table class="table">
                <thead><tr><th>Nome</th><th>Ações</th></tr></thead>
                <tbody id="tabela-marcas"></tbody>
              </table>
            </div>
            <div id="paginacao-marcas" class="mt-4"></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
