<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modelos | Estacionamentos</title>
    <script type="module" crossorigin src="../assets/modelos-CDdBRXiD.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/auth-QZ7grxCN.js">
    <link rel="modulepreload" crossorigin href="../assets/icons-DUaS2wMO.js">
    <link rel="modulepreload" crossorigin href="../assets/layout-BtgD1Zbc.js">
    <link rel="modulepreload" crossorigin href="../assets/paginacao-G185v-st.js">
    <link rel="stylesheet" crossorigin href="../assets/auth-CXbaEo7U.css">
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-50">
    <div id="app-shell">
      <main class="p-6 lg:ml-64">
        <div id="page-header"></div>
        <section class="grid gap-6 lg:grid-cols-[minmax(280px,420px)_1fr]">
          <form id="form-modelo" class="card space-y-4">
            <input id="modelo-id" type="hidden" />
            <div class="flex items-center gap-2">
              <span data-heroicon="squares-2x2" class="text-purple-600"></span>
              <h2 class="text-lg font-bold">Cadastro de modelo</h2>
            </div>
            <div>
              <label for="modelo-marca" class="label">Marca</label>
              <select id="modelo-marca" class="input mt-1" required></select>
            </div>
            <div>
              <label for="modelo-nome" class="label">Nome</label>
              <input id="modelo-nome" class="input mt-1" required />
            </div>
            <div class="flex gap-2">
              <button class="btn-primary" type="submit"><span data-heroicon="plus"></span>Salvar</button>
              <button id="limpar-modelo" class="btn-secondary" type="button">Limpar</button>
            </div>
          </form>
          <div class="card">
            <div class="table-wrapper">
              <table class="table">
                <thead><tr><th>Marca</th><th>Modelo</th><th>Ações</th></tr></thead>
                <tbody id="tabela-modelos"></tbody>
              </table>
            </div>
            <div id="paginacao-modelos" class="mt-4"></div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
